<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080B14" />
    <title>Offline — Tokusatsu Zukan</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 20%, rgba(220, 38, 38, 0.2), #080B14 68%);
        color: #f4f6fc;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 28px 24px;
        border-radius: 20px;
        background: rgba(10, 14, 26, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 20px;
        color: #aeb7d4;
        line-height: 1.55;
        font-size: 0.95rem;
      }
      button {
        min-height: 44px;
        padding: 10px 20px;
        border: 0;
        border-radius: 999px;
        background: #dc2626;
        color: #ffffff;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Anda Sedang Offline</h1>
      <p>
        Halaman ini belum tersimpan di cache lokal. Periksa koneksi internet Anda lalu coba muat ulang.
      </p>
      <button type="button" onclick="window.location.reload()">Muat Ulang</button>
    </main>
  </body>
</html>
